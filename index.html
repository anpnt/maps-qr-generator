<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Link to QR Code</title>
    <script src="https://unpkg.com/easyqrcodejs@4.6.1/dist/easy.qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #4285F4; /* Google Blue */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3367D6;
        }
        
        /* Specific styling for the new Save button */
        #downloadBtn {
            background-color: #34A853; /* Google Green */
            margin-top: 15px;
            display: none; /* Hidden until QR code is generated */
        }
        #downloadBtn:hover {
            background-color: #2b8c45;
        }

        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        
        /* This keeps the massive high-res QR code at a normal size on the screen */
        #qrcode canvas {
            width: 250px !important;
            height: 250px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Maps Link to QR Code</h1>
        <p>Paste a Google Maps link to generate a scannable QR code.</p>
        
        <input type="url" id="linkInput" placeholder="e.g., https://maps.app.goo.gl/...">
        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode"></div>
        
        <button id="downloadBtn" onclick="downloadQR()">Save High-Quality Image</button>
    </div>

    <script>
        function generateQR() {
            let mapLink = document.getElementById('linkInput').value.trim();
            const qrcodeContainer = document.getElementById('qrcode');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Clear any previous QR code and hide the button
            qrcodeContainer.innerHTML = "";
            downloadBtn.style.display = "none";

            if (!mapLink) {
                alert("Please paste a link first!");
                return;
            }

            // Ensure the link starts with http/https
            if (!mapLink.startsWith('http://') && !mapLink.startsWith('https://')) {
                mapLink = 'https://' + mapLink;
            }

            // Configuration for the QR Code
            const options = {
                text: mapLink,
                width: 1024,  // Set to 1024x1024 for maximum download quality
                height: 1024, 
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M, // 'M' is standard and cleaner when there is no logo
            };

            // Generate the QR code
            new QRCode(qrcodeContainer, options);

            // Show the download button
            downloadBtn.style.display = "block";
        }

        function downloadQR() {
            // Find the canvas element that the library just drew
            const canvas = document.querySelector('#qrcode canvas');
            
            if (canvas) {
                // Convert the canvas drawing into a PNG image data URL
                const imageUrl = canvas.toDataURL("image/png");
                
                // Create a temporary link element to trigger the download
                const downloadLink = document.createElement('a');
                downloadLink.href = imageUrl;
                downloadLink.download = 'maps-qr-code.png'; // The name of the saved file
                
                // Append, click, and remove the link
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            } else {
                alert("Please generate a QR code first.");
            }
        }
    </script>
</body>
</html>
