<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Link to QR Code</title>
    <script src="https://unpkg.com/easyqrcodejs@4.6.1/dist/easy.qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #4285F4; /* Google Blue */
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3367D6;
        }
        #qrcode {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Maps Link to QR Code</h1>
        <p>Paste a Google Maps link to generate a scannable QR code.</p>
        
        <input type="url" id="linkInput" placeholder="e.g., https://maps.app.goo.gl/...">
        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode"></div>
    </div>

    <script>
        function generateQR() {
            let mapLink = document.getElementById('linkInput').value.trim();
            const qrcodeContainer = document.getElementById('qrcode');
            
            // Clear any previous QR code
            qrcodeContainer.innerHTML = "";

            if (!mapLink) {
                alert("Please paste a link first!");
                return;
            }

            // Ensure the link starts with http/https so phones recognize it as a clickable URL
            if (!mapLink.startsWith('http://') && !mapLink.startsWith('https://')) {
                mapLink = 'https://' + mapLink;
            }

            // A base64 encoded red Google Maps Pin SVG icon so we don't have to host an image file
            const mapIcon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzODQgNTEyIj48cGF0aCBmaWxsPSIjRUE0MzM1IiBkPSJNMjE1LjcgNDk5LjJDMjY3IDQzNSAzODQgMjc5LjQgMzg0IDE5MkMzODQgODYgMjk4IDAgMTkyIDBTMCA4NiAwIDE5MmMwIDg3LjQgMTE3IDI0MyAxNjguMyAzMDcuMmMxMi4zIDE1LjMgMzUuMSAxNS4zIDQ3LjQgMHpNMTkyIDEyOGE2NCA2NCAwIDEgMSAwIDEyOCA2NCA2NCAwIDEgMSAwLTEyOHoiLz48L3N2Zz4=";

            // Configuration for the QR Code
            const options = {
                text: mapLink, // Directly inserts your exact URL into the QR code
                width: 250,
                height: 250,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H, // 'H' allows 30% of the QR code to be covered by the logo without breaking
                logo: mapIcon,       // Adds the Maps icon
                logoWidth: 60,       // Icon width
                logoHeight: 80,      // Icon height
                logoBackgroundTransparent: true // Ensures the icon doesn't have an ugly white box around it
            };

            // Generate the QR code
            new QRCode(qrcodeContainer, options);
        }
    </script>
</body>
</html>
